ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "technology.breez.glow.passkeyprf"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

// Short-circuit Gradle's dynamic-version resolution cache (default 24h)
// for the `breez_sdk_spark:bindings-android:0.1.0-local-+` wildcard so
// `make sdk-android` publishing a new timestamped coord is picked up
// on the NEXT build — not 24h later. Scoped to this single artifact;
// everything else respects normal Gradle caching.
configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')

    // Breez Spark SDK — published to mavenLocal from spark-sdk build (pr/passkey-core branch).
    // Provides CredentialManagerPrfProvider, PasskeyPrfProvider interface, PasskeyPrfException.
    // Replace with published Maven dependency once SDK PR #781 merges.
    //
    // The `-+` suffix is a dynamic-version wildcard: resolves to the
    // newest mavenLocal version matching `0.1.0-local-<anything>`.
    // `make sdk-android` publishes a timestamped coord on every
    // invocation (see Makefile:SDK_MAVEN_VERSION) so this wildcard
    // always picks up the freshest local build. Fixes the
    // "forgot to rebuild SDK → stale AAR gets linked" footgun that
    // previously surfaced as latent behavior on devices.
    implementation "breez_sdk_spark:bindings-android:0.1.0-local-+"

    // AppCompat (required to resolve Capacitor's AppCompatActivity)
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // AndroidX Credentials (transitive dep of SDK, but declared explicitly for clarity)
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"

    // Coroutines (required by CredentialManagerPrfProvider for Dispatchers.Main)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // Block Store + coroutines bridge: synced credential-IDs registry.
    // Block Store is the closest Android equivalent to iOS's iCloud
    // Keychain — backed by Google Play Services, E2E-encrypted, restored
    // automatically on reinstall and across devices via the user's
    // Google account.
    implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0"

    // EncryptedSharedPreferences fallback: used when Block Store is
    // unavailable (e.g. devices without Google Play Services). Provides
    // at-rest encryption via AndroidKeyStore-backed master key.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // JNA (required by UniFFI-generated Kotlin bindings)
    implementation "net.java.dev.jna:jna:5.18.0@aar"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
