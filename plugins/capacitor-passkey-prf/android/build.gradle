ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "technology.breez.glow.passkeyprf"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

// The SDK binding is pinned to an exact 0.1.0-local-<sha> version, but
// `make sdk-android` can republish that SAME coordinate to mavenLocal
// with rebuilt content (e.g. a native-lib rebuild at the same pinned
// SHA). Treat it as a changing module and never cache it, otherwise
// gradle would keep the first-resolved immutable copy.
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

// Derive the exact published SDK version from the spark-sdk commit pinned
// in .spark-sdk-ref (walk up from this plugin to the glow-app root). Must
// match Makefile's SDK_MAVEN_VERSION so the published coordinate and this
// dependency always agree.
def sparkSdkRefFile = {
    def dir = projectDir
    while (dir != null) {
        def candidate = new File(dir, ".spark-sdk-ref")
        if (candidate.exists()) return candidate
        dir = dir.parentFile
    }
    throw new GradleException("capacitor-passkey-prf: .spark-sdk-ref not found above ${projectDir}")
}()
def sparkSdkSha = sparkSdkRefFile.readLines()
    .collect { it.trim() }
    .findResult { (it ==~ /[0-9a-fA-F]{40}/) ? it.substring(0, 12) : null }
if (sparkSdkSha == null) {
    throw new GradleException("capacitor-passkey-prf: no 40-char SHA in ${sparkSdkRefFile}")
}
def sparkSdkVersion = "0.1.0-local-${sparkSdkSha}"

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')

    // Breez Spark SDK, published to mavenLocal by `make sdk-android`.
    // Provides CredentialManagerPrfProvider, PasskeyPrfProvider interface, PasskeyPrfException.
    // Replace with a published Maven dependency once SDK PR #781 merges.
    //
    // Pinned to the EXACT coordinate built from the spark-sdk commit in
    // .spark-sdk-ref (sparkSdkVersion above). A build links the SDK
    // matching the pin or fails to resolve, never a leftover artifact
    // from an unrelated local SDK build (issue #72).
    implementation("breez_sdk_spark:bindings-android:${sparkSdkVersion}") {
        changing = true
    }

    // AppCompat (required to resolve Capacitor's AppCompatActivity)
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // AndroidX Credentials (transitive dep of SDK, but declared explicitly for clarity)
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"

    // Coroutines (required by CredentialManagerPrfProvider for Dispatchers.Main)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // Block Store + coroutines bridge: synced credential-IDs registry.
    // Block Store is the closest Android equivalent to iOS's iCloud
    // Keychain — backed by Google Play Services, E2E-encrypted, restored
    // automatically on reinstall and across devices via the user's
    // Google account.
    implementation "com.google.android.gms:play-services-auth-blockstore:16.4.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0"

    // EncryptedSharedPreferences fallback: used when Block Store is
    // unavailable (e.g. devices without Google Play Services). Provides
    // at-rest encryption via AndroidKeyStore-backed master key.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // JNA (required by UniFFI-generated Kotlin bindings)
    implementation "net.java.dev.jna:jna:5.18.0@aar"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
