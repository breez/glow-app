ext {
    // 28, not Capacitor's default 24: androidx.credentials passkey creation
    // needs API 28+, and the passkey ceremony is the primary onboarding
    // path with no API-level guard in front of it. Play derives store
    // compatibility from this, so a lower floor offers the install to
    // devices that dead-end at account creation.
    minSdkVersion = 28
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}