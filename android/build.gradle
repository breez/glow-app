// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'
        // Pinned to 3.12.1 — last 3.x release. GPP 4.0.0 (Jan 2025)
        // requires Android Gradle Plugin 9; we ship AGP 8. Dependabot
        // (Phase 4B) will surface AGP-9-compatible bumps when ready.
        classpath 'com.github.triplet.gradle:play-publisher:3.12.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
