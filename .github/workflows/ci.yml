name: CI

# ---------------------------------------------------------------------------
# TRIGGER MODEL — build-on-demand, static-analysis-by-default
# ---------------------------------------------------------------------------
# Pre-overhaul model: every push + PR triggered the full build matrix
# (web + android + iOS), which cost ~300-450 billed min per event and
# burned ~2.9k min over a single 48h release cycle. Most of that work
# was redundant — devs already tested locally via `make deploy-ios` /
# `make deploy-android` before pushing, and CI mostly re-ran what was
# already green.
#
# Current model:
#   - PR open/push        → `web` (static analysis only, ~3 min Linux).
#                           tsc + lint + vitest + cap doctor + SDK pin
#                           + submodule push check. Catches the regressions
#                           static analysis actually catches; trusts the
#                           dev to have compiled the app locally.
#   - Push to `main`      → NO auto-CI. Artifacts are produced only on
#                           explicit intent (tag push or dispatch).
#   - Tag `release-*`     → Full release pipeline (Android AAB → Play
#                           Internal + iOS IPA → TestFlight + GitHub
#                           Release publish). The one place where
#                           "build everything once more to be sure"
#                           earns its macOS minutes.
#   - Tag `preview-*` /
#     `rc-*`              → Firebase App Distribution uploads (iOS +
#                           Android preview jobs). Explicit intent.
#   - workflow_dispatch   → Pick `target` (ios|android|both) ×
#                           `distribution` (none|firebase|store) inputs
#                           below. `version` is required when
#                           distribution=store. `dry_run` skips the
#                           upload step for store-bound builds.
#
# Trade-off: a broken Android build could merge to main without CI
# noticing. Release tag push still catches it loudly before artifacts
# reach users. Between releases, devs own catching build regressions
# locally before pushing. If this proves too loose in practice, a
# weekly `schedule: cron` health-check of
# `target=both distribution=store version=X.Y.Z dry_run=true` would
# catch silent drift within 7 days at ~450 billed min/week.
#
# See DEVELOPMENT.md "CI dispatch reference" for the preset table.
# ---------------------------------------------------------------------------
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    # Note: `branches: [main]` intentionally NOT listed — main pushes
    # run no CI. Release & preview tag pushes are the only auto-triggers
    # that build artifacts.
    tags: ['preview-*', 'rc-*', 'release-*']
  workflow_dispatch:
    inputs:
      # target × distribution is the orthogonal replacement for the
      # older single `job` enum. Every combination maps to exactly
      # one set of platform jobs; `version` gates store uploads;
      # `dry_run` flips store builds into "produce the artifact,
      # skip the upload" for pre-release verification.
      target:
        description: 'Platform to build'
        type: choice
        required: true
        default: 'ios'
        options:
          - ios
          - android
          - both
      distribution:
        description: 'Where to send the build'
        type: choice
        required: true
        default: 'none'
        options:
          # No upload. Unsigned debug/compile-only build for sanity-checking.
          #   target=ios     → xcodebuild unsigned (was `ios-unsigned`).
          #   target=android → assembleDebug + APK artifact (was `android-debug`).
          #   target=both    → fires both unsigned jobs in parallel.
          - none
          # Firebase App Distribution — ad-hoc signed IPA (iOS) or
          # debug APK (Android) against the `.dev` bundle IDs.
          #   target=ios     → was `ios-firebase`.
          #   target=android → was `android-firebase`.
          #   target=both    → fires both preview uploads.
          - firebase
          # Store-bound release. TestFlight (iOS app-store signed) +
          # Play Internal (Android AAB). Requires `version`.
          #   target=ios     → was `ios-testflight`.
          #   target=android → was `android-internal`.
          #   target=both    → was `full-release`. Use with dry_run=true
          #                    to verify the full release pipeline without
          #                    uploading.
          - store
      version:
        description: 'Marketing version MAJOR.MINOR.PATCH — required when distribution=store (e.g. 0.0.2)'
        type: string
        default: ''
      dry_run:
        description: 'Build + sign but skip the upload step (only meaningful when distribution=store)'
        type: boolean
        default: false

# Cancel superseded runs on the same PR / branch. Matches the glow-web
# pattern and saves ~15–25% of minute burn on busy PRs (especially
# iOS, which is the expensive job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The ios-preview job (Step 6) scopes up to
# what Firebase App Distribution needs.
permissions:
  contents: read

jobs:
  # NOTE: the former `changes` path-filter job was removed when CI was
  # restructured to build-on-demand. PRs now always run the web static-
  # analysis gate (tsc + lint + vitest + cap doctor + submodule check),
  # and the expensive build jobs (android/ios) never fire on PR events
  # — they're moved to workflow_dispatch (see the `target` / `distribution` inputs).

  # Gate on workflow_dispatch input combinations. Catches invalid combos
  # (distribution=store with no version, malformed version, etc.) in
  # <30s on a Linux runner before any macOS runner spins up. Wired into
  # every dispatch-reachable job's `needs:` so an invalid dispatch can't
  # burn ~200 macOS min before the first build step notices the problem.
  #
  # Skipped on tag pushes + PR events — the `github.event_name` gate
  # keeps it off the hot path. Downstream jobs use
  # `needs.validate-inputs.result != 'failure'` so a skipped validate
  # (non-dispatch event) doesn't cascade into a skip.
  validate-inputs:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # Needed only so the `report-billable-cost` local composite action
      # below can be resolved from the runner's workspace. Sparse so we
      # don't pull the submodule tree we don't need for input validation.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/report-billable-cost
          sparse-checkout-cone-mode: false

      - name: Enforce input combinations
        env:
          TARGET:       ${{ inputs.target }}
          DISTRIBUTION: ${{ inputs.distribution }}
          VERSION:      ${{ inputs.version }}
          DRY_RUN:      ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          warn() { echo "::warning::$1"; }

          if [[ "$DISTRIBUTION" == "store" ]]; then
            [[ -n "$VERSION" ]] || fail "distribution=store requires version input (MAJOR.MINOR.PATCH, e.g. 0.0.2)"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must match MAJOR.MINOR.PATCH, got: '$VERSION'"
          fi

          if [[ -n "$VERSION" && "$DISTRIBUTION" != "store" ]]; then
            warn "version='$VERSION' ignored — only distribution=store uses version"
          fi

          if [[ "$DRY_RUN" == "true" && "$DISTRIBUTION" != "store" ]]; then
            warn "dry_run=true ignored — only distribution=store has an upload step to skip"
          fi

          echo "::notice::validated target=$TARGET distribution=$DISTRIBUTION version=${VERSION:-<none>} dry_run=$DRY_RUN"

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # Linux-side probe of the macOS SDK artifact cache. Runs on a 1×
  # ubuntu runner before any macOS VM spins up and sets an output
  # that `warm-sdk-macos` reads via `needs.preflight.outputs.ios-cache-hit`.
  #
  # Why Linux can probe a macOS cache: GitHub's cache service is
  # OS-agnostic at the lookup level — the cache key (sdk-artifacts-
  # macOS-<SHA>) is just a string. Only the cached PAYLOAD is
  # macOS-specific (xcframework paths). `lookup-only: true` checks
  # existence without downloading anything.
  #
  # Savings: ~2–3 macOS min × 10× billing per iOS run on a warm-cache
  # path. Before this job, warm-sdk-macos would spin up a macos-15 VM
  # just to verify the cache existed (the composite action's consumer-
  # mode restore takes ~1-2 min on macOS start). Now that's a <10s
  # lookup on a Linux runner.
  #
  # Fail-open: `continue-on-error` on the probe step + an explicit
  # output-setting step mean any failure yields `ios-cache-hit=''`,
  # which `warm-sdk-macos` reads as "not a confirmed hit" → warmer
  # runs. We never regress correctness, only skip when we're sure.
  #
  # 7-day cache eviction: GitHub evicts caches after 7 days of no
  # access. A cold-cache event is therefore surfaced EARLIER (at the
  # preflight's `::notice::` output) than the old model, where the
  # miss surfaced mid-warmer. Legibility win even on cold paths.
  preflight:
    name: Preflight (probe macOS SDK cache from Linux)
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    timeout-minutes: 2
    # `!cancelled()` bypasses the default-skip cascade from
    # validate-inputs (dispatch-only) on tag pushes. See warm-sdk-linux
    # for rationale.
    # Runs iff warm-sdk-macos might run. Skipped otherwise so PRs
    # without run-ios + dispatches for android-only stay Linux-only.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      (contains(github.event.pull_request.labels.*.name, 'run-ios') ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target)))
    outputs:
      ios-cache-hit: ${{ steps.set-output.outputs.ios-cache-hit }}
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # Submodules omitted — we only need `.spark-sdk-ref` from the
      # top-level repo to derive the cache key, not the glow-web tree
      # or the Pods it'd pull in.
      - uses: actions/checkout@v6

      - name: Read pinned SDK SHA
        id: sdk-sha
        # Must match the composite action's `grep -vE '^\s*(#|$)'`
        # logic verbatim — any divergence yields a miss-shaped hash
        # and defeats the whole preflight.
        run: |
          echo "sha=$(grep -vE '^\s*(#|$)' .spark-sdk-ref | head -n 1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Probe macOS SDK artifact cache
        id: probe
        # `continue-on-error: true` is the fail-open mechanism: a cache
        # service blip, auth glitch, or typo'd key yields an error here
        # but doesn't fail the job. The next step sees an empty
        # `cache-hit` and writes `ios-cache-hit=''` downstream, which
        # warm-sdk-macos reads as "not a confirmed hit" → runs anyway.
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          # Must match warm-sdk-macos's key exactly. The composite
          # action constructs `sdk-artifacts-${{ runner.os }}-<SHA>`
          # where runner.os evaluates to "macOS" on the macos-15 VM;
          # we hardcode "macOS" here since we're probing from Linux.
          key: sdk-artifacts-macOS-${{ steps.sdk-sha.outputs.sha }}
          # Paths must be specified for cache/restore to run but are
          # not used under `lookup-only: true` (no download happens).
          # Mirror the composite action's paths for clarity.
          path: |
            .spark-sdk-checkout/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz
            .spark-sdk-checkout/crates/breez-sdk/bindings/langs/swift
            ~/.m2/repository/breez_sdk_spark
          lookup-only: true

      - name: Set ios-cache-hit output
        id: set-output
        run: |
          hit="${{ steps.probe.outputs.cache-hit }}"
          echo "ios-cache-hit=${hit:-}" >> "$GITHUB_OUTPUT"
          if [[ "$hit" == "true" ]]; then
            echo "::notice::macOS SDK cache HIT for sha=${{ steps.sdk-sha.outputs.sha }} — skipping warm-sdk-macos"
          else
            echo "::notice::macOS SDK cache MISS or error (hit='${hit:-}') for sha=${{ steps.sdk-sha.outputs.sha }} — warm-sdk-macos will run"
          fi

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # Dedicated SDK "warmer" jobs — build the spark-sdk from source
  # once per pinned SHA per OS, cache the output artifacts. Every
  # downstream job `needs:`-waits for the matching warmer and runs
  # setup-glow-app in consumer mode (cache-restore only, no
  # toolchain install, no SDK build). On warm cache, the warmer is
  # ~1-2 min (restore only) and downstream jobs skip setup-glow-app
  # heavy lifting entirely. On cold cache (new SDK SHA), the SDK
  # build cost is paid ONCE instead of per-job.
  #
  # Both warmers use CACHE_ON_FAILURE and save-on-exit semantics via
  # actions/cache@v5's default behavior, so even if a downstream job
  # later fails, the cache from the warmer remains for subsequent
  # runs.
  # Fires whenever any Linux-consuming downstream job will run. On a PR
  # that's the web static-analysis job (needs the WASM tgz to `npm
  # install` glow-web's SDK dep); on a release-* tag it's android +
  # android-release; on a dispatch it's any run that includes android
  # (target=android|both) — also covers the target=both distribution=store
  # case, since the `web` gate runs there too.
  warm-sdk-linux:
    name: Warm SDK cache (Linux — wasm + android)
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    timeout-minutes: 30
    # `!cancelled()` bypasses the default-skip cascade from
    # validate-inputs when it's skipped (tag pushes don't fire
    # validate-inputs — it's gated on workflow_dispatch only).
    # Without this prefix, `needs:` treats "upstream skipped" the
    # same as "upstream failed" and this job inherits a skip,
    # regardless of what the explicit `if:` expression below resolves
    # to. release-0.0.3's first CI run failed exactly this way: every
    # `needs: [validate-inputs]` warmer/preflight job skipped on the
    # tag push, downstream consumer jobs then ran on empty caches.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      (github.event_name == 'pull_request' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["android","both"]'), inputs.target)))
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android
          mode: warmer
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # Only fires when an iOS build will consume the xcframework AND the
  # preflight probe did NOT confirm a macOS SDK cache hit. The
  # `preflight.outputs.ios-cache-hit != 'true'` check is the cost
  # optimization — a Linux runner verified existence first, so we
  # skip the ~3 macOS min the composite action's consumer restore
  # would otherwise burn just to confirm what preflight already knew.
  #
  # Consumer iOS jobs (ios, ios-preview, ios-release) still restore
  # the cache inline via setup-glow-app — this skip only saves the
  # dedicated "verify only" macOS round-trip, not the actual restore
  # by the build job.
  warm-sdk-macos:
    name: Warm SDK cache (macOS — wasm + ios)
    runs-on: macos-15
    needs: [validate-inputs, preflight]
    timeout-minutes: 60
    # `!cancelled()` bypasses the default-skip cascade from
    # validate-inputs (dispatch-only). See warm-sdk-linux for rationale.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.preflight.outputs.ios-cache-hit != 'true' &&
      (contains(github.event.pull_request.labels.*.name, 'run-ios') ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target)))
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios
          mode: warmer

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # The static-analysis gate for every PR. Always runs. Covers:
  #   - tsc --noEmit on glow-web
  #   - eslint on glow-web
  #   - vitest run on glow-web
  #   - `cap doctor` — validates Capacitor config + plugin wiring
  #   - glow-web submodule pushed-to-origin check — catches dev error
  #     where submodule bump commits to a local-only SHA that CI /
  #     teammates can't fetch (the 48h cycle that birthed this refactor
  #     lost ~300 min debugging exactly this kind of silent footgun).
  #
  # Explicitly does NOT build Android or iOS — that's the dev's
  # responsibility to have done locally before pushing. Static analysis
  # catches type/lint/test regressions; build regressions are caught at
  # release-tag time or by explicit `workflow_dispatch` of the relevant
  # build job.
  web:
    name: Web (glow-web submodule)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux, validate-inputs]
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      (github.event_name == 'pull_request' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.target == 'both' && inputs.distribution == 'store'))
    # Cold-run: build the WASM SDK from source (~10 min) + install
    # glow-web deps + run tsc/eslint/vitest. Warm cache: ~3 min total.
    timeout-minutes: 20
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm

      # NOTE: a submodule-pushed-to-origin check was considered here, but
      # is redundant with actions/checkout's own behavior: if the SHA
      # glow-app pins for glow-web isn't fetchable from origin, the
      # `submodules: recursive` fetch above fails with "reference is not
      # a tree" BEFORE this job's steps run. Catching that pre-entry was
      # the intent; it's already caught upstream with a louder error.

      - name: Install glow-web deps + local Spark SDK tgz
        # The composite action restored the WASM tgz into
        # $SPARK_SDK_DIR/packages/wasm/. The env var is exported
        # from setup-glow-app so `make` + this script agree on the
        # location (workspace-relative to avoid actions/cache's
        # `..`-path rejection).
        # `npm install <tgz>` overlays it on @breeztech/breez-sdk-spark
        # without mutating the lockfile.
        run: |
          set -euo pipefail
          TGZ="$SPARK_SDK_DIR/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz"
          if [[ ! -f "$TGZ" ]]; then
            echo "error: expected WASM tgz at $TGZ — warmer cache restore failed?" >&2
            exit 1
          fi
          echo "Installing local SDK: $TGZ"
          cd glow-web
          npm ci
          npm install "$TGZ" --no-save

      - name: Typecheck
        run: cd glow-web && npx tsc --noEmit

      - name: Lint
        run: cd glow-web && npm run lint

      - name: Unit tests
        run: cd glow-web && npm run test

      # NOTE: `npx cap doctor` was considered as an extra validation
      # step but requires ./glow-web/dist to exist (deployment check,
      # not pure static analysis). Adding it would force `make web`
      # into the PR gate, which defeats the build-on-demand model.
      # Plugin-wiring issues will be caught at the first build-dispatch.

      # Upload vitest coverage artifacts on failure for PR-page
      # drilldown without needing a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: glow-web/coverage/**/*.json
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # Android debug APK compile + artifact upload. Does NOT fire on PR
  # events or main pushes — devs test locally via `make deploy-android`
  # before pushing. Triggered explicitly on:
  #   - release-* tag push (release pipeline pre-flight — fires in parallel
  #     with android-release to produce a debug APK artifact alongside the
  #     store-signed AAB)
  #   - workflow_dispatch with target=android|both AND distribution=none
  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux, validate-inputs]
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/release-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["android","both"]'), inputs.target) &&
        inputs.distribution == 'none'))
    # 45 min is cold-run headroom: first run builds the WASM SDK
    # (~10 min) + Android NDK install (~3 min) + Android AAR
    # cross-compile (~5 min) + glow-web vite build (~3 min) +
    # gradle assembleDebug (~5 min). Warm runs with SDK cache hit
    # are ~8 min.
    timeout-minutes: 45
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - name: Setup JDK 21 (Capacitor 8 + AGP 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Encrypts the Gradle configuration-cache across runs.
          # Safe without the secret — the action falls back to a
          # non-encrypted shared cache when omitted.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Warm up Gradle wrapper distribution (absorb transient 504s)
        run: ./scripts/ci/warmup-gradle-wrapper.sh android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.sha }}-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Failure-only upload of gradle / lint reports so the PR page
      # has enough to diagnose without a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  ios:
    name: iOS (xcodebuild, unsigned)
    runs-on: macos-15
    needs: [warm-sdk-macos, validate-inputs]
    # 60 min cold-run headroom: iOS cross-compile is slower than
    # Android (~15 min), plus xcodebuild itself (~10 min on a cold
    # Pods cache). Warm runs with SDK + Pods cache hit are ~5 min.
    timeout-minutes: 60
    # Unsigned compile-check. Does NOT fire on release-* tag push — that
    # already runs ios-release (signed) which does its own archive build,
    # and running a duplicate unsigned archive would double the macOS
    # burn. PRs opt in via the `run-ios` label for dev smoke-testing
    # when the dev wants CI to confirm the iOS build still compiles.
    # NB: `!cancelled()` is load-bearing. GH Actions implicitly prepends
    # `success()` to every `if:` — with `warm-sdk-macos` in `needs:`,
    # a preflight cache hit (→ warm-sdk-macos SKIPPED) flips the implicit
    # success() to false and this job skips too, even with our explicit
    # `!= 'failure'` checks. `!cancelled()` overrides that default and
    # lets the explicit result checks decide. Learned the hard way via
    # run 24618034776 — symmetric bug across all three iOS consumers.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-macos.result != 'failure' &&
      (contains(github.event.pull_request.labels.*.name, 'run-ios') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target) &&
        inputs.distribution == 'none'))
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        # Pin Xcode to match local builds. macos-15 ships multiple
        # Xcode versions; the pin avoids invalidation when GitHub
        # rotates the default.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: CocoaPods cache
        uses: actions/cache@v5
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Clear Swift PM artifacts cache (flake prevention)
        # Xcode 26's Swift PM sometimes errors with:
        #   "failed downloading 'https://github.com/ionic-team/capacitor
        #    -swift-pm/releases/download/<ver>/Capacitor.xcframework.zip'
        #    ... already exists in file system"
        # when a partial/stale binary-target download is in
        # ~/Library/Caches/org.swift.swiftpm. Clearing ensures a fresh
        # resolve on each run. ~/Library/Developer/Xcode/DerivedData
        # is also safe to nuke for consistency but only the swiftpm
        # cache is the known flake vector.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: xcodebuild (unsigned device build)
        # Matches the local command in DEVELOPMENT.md. The three
        # CODE_SIGN_* flags together make xcodebuild stop
        # negotiating signing — Phase 4C wires signing back up for
        # TestFlight.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -allowProvisioningUpdates=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Upload xcodebuild log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: xcodebuild.log
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  ios-preview:
    name: iOS preview (Firebase App Distribution)
    runs-on: macos-15
    needs: [warm-sdk-macos, validate-inputs]
    # Same cold-run budget as the `ios` job plus FAD upload time.
    timeout-minutes: 60
    # Tag-triggered (preview-* / rc-*) or manually dispatched.
    # Does NOT run on every main push — the CI plan-tier analysis
    # in plan-4b Step 10 assumes a maintainer-chosen cadence to
    # stay inside Free/Pro/Team macOS-minute quotas.
    # Fires on preview-*/rc-* tag pushes OR explicit workflow_dispatch
    # with target=ios|both AND distribution=firebase. Explicitly NOT
    # fired when distribution=store — the .dev ad-hoc provisioning
    # profile is currently broken (see DEVELOPMENT.md follow-ups), so
    # only trigger the upload path when the dev explicitly asks for it.
    # NB: `!cancelled()` is load-bearing — see comment on `ios` job above.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-macos.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/preview-') ||
       startsWith(github.ref, 'refs/tags/rc-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target) &&
        inputs.distribution == 'firebase'))
    permissions:
      contents: read
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_PREVIEW_KEYCHAIN_PASSWORD }}
      P12_BASE64: ${{ secrets.IOS_PREVIEW_CERT_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_PREVIEW_CERT_P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PREVIEW_PROFILE_BASE64 }}
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: CocoaPods cache
        uses: actions/cache@v5
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Import distribution cert + ad-hoc profile
        run: ./scripts/ci/import-ios-cert.sh

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Clear Swift PM artifacts cache (flake prevention)
        # Xcode 26's Swift PM sometimes errors with:
        #   "failed downloading 'https://github.com/ionic-team/capacitor
        #    -swift-pm/releases/download/<ver>/Capacitor.xcframework.zip'
        #    ... already exists in file system"
        # when a partial/stale binary-target download is in
        # ~/Library/Caches/org.swift.swiftpm. Clearing ensures a fresh
        # resolve on each run. ~/Library/Developer/Xcode/DerivedData
        # is also safe to nuke for consistency but only the swiftpm
        # cache is the known flake vector.
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Archive + export IPA (Debug, ad-hoc)
        run: ./scripts/ci/build-ios-ipa.sh Debug ad-hoc

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID_PREVIEW }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal
          releaseNotes: |
            Trigger: ${{ github.ref_name }} (${{ github.event_name }})
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message || 'manual dispatch' }}
          file: build/App.ipa

      - name: Upload archive on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-preview-archive
          path: build/App.xcarchive
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # ---------------------------------------------------------------
  # Phase 4C jobs below. preview-* / rc-* tags add Android FAD;
  # release-* tags fan out to android-release + ios-release, then
  # release-github finalizes with a GitHub Release.
  # ---------------------------------------------------------------

  android-preview:
    name: Android preview (Firebase App Distribution)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux, validate-inputs]
    timeout-minutes: 30
    # Parity with ios-preview: fires on preview-*/rc-* tag pushes OR
    # explicit dispatch with target=android|both AND distribution=firebase.
    # No main-push trigger.
    # NB: `!cancelled()` is load-bearing — see comment on `ios` job above.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-linux.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/preview-') ||
       startsWith(github.ref, 'refs/tags/rc-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["android","both"]'), inputs.target) &&
        inputs.distribution == 'firebase'))
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Warm up Gradle wrapper distribution (absorb transient 504s)
        run: ./scripts/ci/warmup-gradle-wrapper.sh android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID_PREVIEW }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal
          releaseNotes: |
            Trigger: ${{ github.ref_name }} (${{ github.event_name }})
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message || 'manual dispatch' }}
          file: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-preview-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  android-release:
    name: Android release (Play Internal)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux, validate-inputs]
    # Cold-run budget: web + WASM build + Android NDK + AAR
    # cross-compile + bundleRelease + Play upload. With cache hits
    # the Play upload itself is the slowest step (~2-3 min).
    timeout-minutes: 45
    # release-* tag push (full release pipeline) OR workflow_dispatch
    # with target=android|both AND distribution=store. Pair with
    # dry_run=true to verify the upload pipeline without publishing.
    # NB: `!cancelled()` is load-bearing — see comment on `ios` job above.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-linux.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/release-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["android","both"]'), inputs.target) &&
        inputs.distribution == 'store'))
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Need full history so release-notes.sh can find the prior
          # release-* tag. Default fetch-depth: 1 would only see HEAD.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        # Strip whitespace before decode. `base64 -i file` commonly
        # wraps at 76 chars with LF separators; if the secret also
        # picked up a trailing newline from `gh secret set < file`,
        # GNU base64 may fail with "invalid input". tr -d removes
        # any whitespace safely (valid base64 only uses [A-Za-z0-9+/=]).
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write Play service account
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "$PLAY_SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Compute version from tag
        # GLOW_RELEASE_TAG override path (see ios-release step comment
        # for rationale). On release-* tag push, GITHUB_REF_NAME is
        # already correct and GLOW_RELEASE_TAG stays empty.
        env:
          GLOW_RELEASE_TAG: >-
            ${{ (github.event_name == 'workflow_dispatch' &&
                 inputs.distribution == 'store')
                && format('release-{0}', inputs.version)
                || '' }}
        run: ./scripts/ci/compute-version.sh

      - name: Generate release notes
        # GPP reads from the release-notes file path; we overwrite
        # the en-US/internal.txt placeholder with the git-log
        # output before publishReleaseBundle runs.
        #
        # Play caps release notes at 500 chars per locale. Longer
        # notes cause GPP's edits:commit to fail with:
        #   "The release created has notes in language en-US with
        #    length N, which is too long (max: 500)"
        # Truncate to 497 chars + "…" preserving the first few
        # commit subjects (most recent work first, since git log
        # output is newest-to-oldest by default).
        run: |
          set -euo pipefail
          FULL_NOTES="$(./scripts/ci/release-notes.sh)"
          if [[ ${#FULL_NOTES} -gt 500 ]]; then
            SHORT_NOTES="${FULL_NOTES:0:497}…"
          else
            SHORT_NOTES="$FULL_NOTES"
          fi
          printf '%s\n' "$SHORT_NOTES" > android/app/src/main/play/release-notes/en-US/internal.txt
          echo "=== Play internal.txt (truncated to ${#SHORT_NOTES} chars) ==="
          cat android/app/src/main/play/release-notes/en-US/internal.txt

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Warm up Gradle wrapper distribution (absorb transient 504s)
        run: ./scripts/ci/warmup-gradle-wrapper.sh android

      - name: Gradle bundleRelease + publish
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew :app:bundleRelease :app:publishReleaseBundle --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.ref_name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-release-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  ios-release:
    name: iOS release (TestFlight)
    runs-on: macos-15
    needs: [warm-sdk-macos, validate-inputs]
    # Cold-run budget: web + WASM + iOS xframework cross-compile +
    # Pods install + xcodebuild archive + IPA export + TestFlight
    # upload. ASC-side processing time is excluded
    # (skip_waiting_for_build_processing in Fastfile).
    timeout-minutes: 75
    # Fires on:
    # - release-* tag push: cuts the iOS side of a full release
    #   (paired with android-release + release-github).
    # - workflow_dispatch with target=ios distribution=store: iOS-only
    #   hotfix rebuild against whatever ref the dispatch targeted,
    #   without re-firing android-release / release-github.
    # - workflow_dispatch with target=both distribution=store: fires
    #   alongside android-release. Pair with dry_run=true to verify
    #   the full release pipeline without uploading.
    # NB: `!cancelled()` is load-bearing — see comment on `ios` job above.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-macos.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/release-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target) &&
        inputs.distribution == 'store'))
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # release-notes.sh needs full tag history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps
        run: npm ci

      - name: Clear Swift PM artifacts cache (flake prevention)
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Capacitor sync (iOS)
        # Run BEFORE apply-ios-version + signing. cap sync rewrites
        # Pods refs but preserves CURRENT_PROJECT_VERSION /
        # MARKETING_VERSION; running it first ensures version +
        # signing both land on the post-sync project state.
        run: npx cap sync ios

      - name: Compute version from tag
        # GitHub Actions silently ignores attempts to override default
        # env vars like GITHUB_REF_NAME via $GITHUB_ENV — so the initial
        # ios-hotfix dispatch shipped a build versioned 0.0.0. Pass the
        # override via our own GLOW_RELEASE_TAG env var, which
        # compute-version.sh consults first (see script header).
        env:
          GLOW_RELEASE_TAG: >-
            ${{ (github.event_name == 'workflow_dispatch' &&
                 inputs.distribution == 'store')
                && format('release-{0}', inputs.version)
                || '' }}
        run: ./scripts/ci/compute-version.sh

      - name: Apply version to iOS project
        run: ./scripts/ci/apply-ios-version.sh

      - name: Generate release notes
        run: |
          set -euo pipefail
          NOTES=$(./scripts/ci/release-notes.sh)
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Import distribution cert + app-store profile
        # Maps the IOS_RELEASE_* secrets onto the generic env vars
        # import-ios-cert.sh reads. Same cert as ios-preview; only
        # the profile differs (app-store vs ad-hoc).
        env:
          P12_BASE64: ${{ secrets.IOS_RELEASE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_RELEASE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_RELEASE_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_RELEASE_PROFILE_BASE64 }}
        run: ./scripts/ci/import-ios-cert.sh

      - name: Archive + export IPA (Release, app-store)
        run: ./scripts/ci/build-ios-ipa.sh Release app-store-connect

      - name: Upload to TestFlight via fastlane
        working-directory: ios/App
        env:
          # Dual auth — Fastfile picks API key if all three are set,
          # falls back to FASTLANE_USER/PASSWORD otherwise. Missing
          # secrets render as empty strings; the Fastfile's
          # `env_present?` helper treats "" as absent.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          # Optional — 2FA session cookie. Only needed on legacy path
          # for `upload_to_testflight` changelog updates against a
          # 2FA-protected Apple ID. Generate locally via
          # `fastlane spaceauth -u <email>`; expires every few weeks.
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          # build-ios-ipa.sh writes to $GITHUB_WORKSPACE/build/App.ipa
          # (repo-root build/). fastlane's working-directory is
          # ios/App/, so we pass the absolute path via the IPA_PATH
          # override the Fastfile reads.
          IPA_PATH: ${{ github.workspace }}/build/App.ipa
        run: bundle exec fastlane upload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.ref_name }}-ipa
          path: build/App.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-release-archive
          path: build/App.xcarchive
          retention-days: 7

      - uses: ./.github/actions/report-billable-cost
        if: always()

  # Publishes a GitHub Release tagged `release-X.Y.Z` with the AAB +
  # IPA artifacts from the upstream jobs. ONLY fires on an actual
  # release-* tag push — a target=both distribution=store dispatch
  # builds the same artifacts but intentionally does NOT publish a GH
  # Release (there is no tag to attach it to).
  release-github:
    name: Publish GitHub Release
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    # `!cancelled()` + explicit success checks on both upstreams.
    # release-0.0.3's first attempt had both android-release and
    # ios-release ending at 'success' but release-github still skipped
    # because a transitive upstream (validate-inputs, which is
    # dispatch-only) was 'skipped' — and the default skip-cascade
    # propagates through transitively unless a condition explicitly
    # overrides it. Explicitly require both upstreams to have
    # succeeded so we don't publish a GH Release with missing
    # artifacts.
    if: >-
      !cancelled() &&
      needs.android-release.result == 'success' &&
      needs.ios-release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/release-')
    permissions:
      # softprops/action-gh-release needs write to mutate releases.
      contents: write
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Names: glow-<tag>-aab + glow-<tag>-ipa from the two upstream jobs.
          pattern: glow-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Compose release notes
        run: ./scripts/ci/release-notes.sh > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.aab
            artifacts/**/*.ipa
          prerelease: false
          make_latest: true

      - uses: ./.github/actions/report-billable-cost
        if: always()
