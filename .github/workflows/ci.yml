name: CI

# Keep docs-only PRs off the full build matrix. paths-ignore applies
# to the whole workflow; if any path NOT in this list changed, all
# jobs run.
#
# ios-preview additionally fires on preview-* / rc-* tags and on
# manual workflow_dispatch; see the job-level `if:` in Step 6.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    tags: ['preview-*', 'rc-*']
  workflow_dispatch:

# Cancel superseded runs on the same PR / branch. Matches the glow-web
# pattern and saves ~15–25% of minute burn on busy PRs (especially
# iOS, which is the expensive job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The ios-preview job (Step 6) scopes up to
# what Firebase App Distribution needs.
permissions:
  contents: read

jobs:
  web:
    name: Web (glow-web submodule)
    runs-on: ubuntu-latest
    # 20 min is cold-run headroom: the first run has to build the
    # WASM SDK from source (~10 min) + install glow-web deps + run
    # tsc/eslint/vitest. Warm runs with SDK cache hit are ~3 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm

      - name: Install glow-web deps + local Spark SDK tgz
        # The composite action restored the WASM tgz into
        # ../spark-sdk/packages/wasm/. Resolve to an absolute path
        # before `cd glow-web` — a relative `../spark-sdk/...` would
        # resolve against the new PWD and land one directory off.
        # `npm install <tgz>` overlays it on @breeztech/breez-sdk-spark
        # without mutating the lockfile.
        run: |
          set -euo pipefail
          TGZ="$(realpath ../spark-sdk/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz)"
          echo "Installing local SDK: $TGZ"
          cd glow-web
          npm ci
          npm install "$TGZ" --no-save

      - name: Typecheck
        run: cd glow-web && npx tsc --noEmit

      - name: Lint
        run: cd glow-web && npm run lint

      - name: Unit tests
        run: cd glow-web && npm run test

      # Upload vitest coverage artifacts on failure for PR-page
      # drilldown without needing a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: glow-web/coverage/**/*.json
          retention-days: 7

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    # 45 min is cold-run headroom: first run builds the WASM SDK
    # (~10 min) + Android NDK install (~3 min) + Android AAR
    # cross-compile (~5 min) + glow-web vite build (~3 min) +
    # gradle assembleDebug (~5 min). Warm runs with SDK cache hit
    # are ~8 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - name: Setup JDK 21 (Capacitor 8 + AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Encrypts the Gradle configuration-cache across runs.
          # Safe without the secret — the action falls back to a
          # non-encrypted shared cache when omitted.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.sha }}-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Failure-only upload of gradle / lint reports so the PR page
      # has enough to diagnose without a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

  ios:
    name: iOS (xcodebuild, unsigned)
    runs-on: macos-15
    # 60 min cold-run headroom: iOS cross-compile is slower than
    # Android (~15 min), plus xcodebuild itself (~10 min on a cold
    # Pods cache). Warm runs with SDK + Pods cache hit are ~5 min.
    timeout-minutes: 60
    # Always run on main pushes and on preview / rc tags (so main
    # status never drifts). On PRs, opt in via the 'run-ios' label
    # to contain macOS-minute burn. Branch protection should be
    # configured with "skipped = passing" so PRs without the label
    # can still merge — see DEVELOPMENT.md#branch-protection.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-ios')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        # Pin Xcode to match local builds. macos-15 ships multiple
        # Xcode versions; the pin avoids invalidation when GitHub
        # rotates the default.
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: xcodebuild (unsigned device build)
        # Matches the local command in DEVELOPMENT.md. The three
        # CODE_SIGN_* flags together make xcodebuild stop
        # negotiating signing — Phase 4C wires signing back up for
        # TestFlight.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -allowProvisioningUpdates=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Upload xcodebuild log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: xcodebuild.log
          retention-days: 7

  ios-preview:
    name: iOS preview (Firebase App Distribution)
    runs-on: macos-15
    # Same cold-run budget as the `ios` job plus FAD upload time.
    timeout-minutes: 60
    # Tag-triggered (preview-* / rc-*) or manually dispatched.
    # Does NOT run on every main push — the CI plan-tier analysis
    # in plan-4b Step 10 assumes a maintainer-chosen cadence to
    # stay inside Free/Pro/Team macOS-minute quotas.
    if: >-
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/preview-') ||
        startsWith(github.ref, 'refs/tags/rc-')
      )) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_PREVIEW_KEYCHAIN_PASSWORD }}
      P12_BASE64: ${{ secrets.IOS_PREVIEW_CERT_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_PREVIEW_CERT_P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PREVIEW_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Import ad-hoc certificate + provisioning profile
        run: ./scripts/ci/import-ios-ad-hoc-cert.sh

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Archive + export IPA
        run: ./scripts/ci/build-ios-ipa.sh Debug

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal
          releaseNotes: |
            Trigger: ${{ github.ref_name }} (${{ github.event_name }})
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message || 'manual dispatch' }}
          file: build/App.ipa

      - name: Upload archive on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-preview-archive
          path: build/App.xcarchive
          retention-days: 7
