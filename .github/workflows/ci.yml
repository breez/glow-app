name: CI

# Keep docs-only PRs off the full build matrix. paths-ignore applies
# to the whole workflow; if any path NOT in this list changed, all
# jobs run.
#
# ios-preview additionally fires on preview-* / rc-* tags and on
# manual workflow_dispatch; see the job-level `if:` in Step 6.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    tags: ['preview-*', 'rc-*']
  workflow_dispatch:

# Cancel superseded runs on the same PR / branch. Matches the glow-web
# pattern and saves ~15–25% of minute burn on busy PRs (especially
# iOS, which is the expensive job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The ios-preview job (Step 6) scopes up to
# what Firebase App Distribution needs.
permissions:
  contents: read

jobs:
  web:
    name: Web (glow-web submodule)
    runs-on: ubuntu-latest
    # 20 min is cold-run headroom: the first run has to build the
    # WASM SDK from source (~10 min) + install glow-web deps + run
    # tsc/eslint/vitest. Warm runs with SDK cache hit are ~3 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm

      - name: Install glow-web deps + local Spark SDK tgz
        # The composite action restored the WASM tgz into
        # ../spark-sdk/packages/wasm/. Resolve to an absolute path
        # before `cd glow-web` — a relative `../spark-sdk/...` would
        # resolve against the new PWD and land one directory off.
        # `npm install <tgz>` overlays it on @breeztech/breez-sdk-spark
        # without mutating the lockfile.
        run: |
          set -euo pipefail
          TGZ="$(realpath ../spark-sdk/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz)"
          echo "Installing local SDK: $TGZ"
          cd glow-web
          npm ci
          npm install "$TGZ" --no-save

      - name: Typecheck
        run: cd glow-web && npx tsc --noEmit

      - name: Lint
        run: cd glow-web && npm run lint

      - name: Unit tests
        run: cd glow-web && npm run test

      # Upload vitest coverage artifacts on failure for PR-page
      # drilldown without needing a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: glow-web/coverage/**/*.json
          retention-days: 7
