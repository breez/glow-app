name: CI

# Trigger model (build-on-demand):
#   - PR open/push → `web` only (tsc + lint + vitest, ~3 min Linux).
#   - main push    → SDK cache warmers ONLY (no consumer jobs, no
#                    artifacts). GitHub cache scoping lets every branch,
#                    PR, and tag restore default-branch caches but never
#                    each other's — main must hold the canonical warm
#                    caches or every tag push cold-rebuilds ~40 min of
#                    SDK artifacts that already exist in a sibling scope
#                    (release-0.1.0 paid this three times).
#   - release-* tag → full release pipeline (AAB → Play Internal + IPA →
#                     TestFlight + GitHub Release).
#   - preview-* / rc-* tag → Firebase App Distribution uploads.
#   - workflow_dispatch → target × distribution × (version for store).
# Trade-off: a broken Android/iOS build could merge to main undetected —
# the release-tag path catches it before artifacts reach users. See
# DEVELOPMENT.md "CI dispatch reference" for the preset table.
#
# Release-cutting note: tag pushes inherit main's warm cache only if the
# post-merge warm run has FINISHED. A tag pushed seconds after merging a
# pin bump races a ~40-min cold warm and rebuilds on its own — cut tags
# after the main-push CI run completes.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    # main pushes exist solely to populate the default-branch cache
    # scope — the warm-sdk-* jobs' `if:` conditions are the gate that
    # keeps every consumer job off this event.
    branches: [main]
    tags: ['preview-*', 'rc-*', 'release-*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        type: choice
        required: true
        default: 'ios'
        options:
          - ios
          - android
          - both
      distribution:
        description: 'Where to send the build'
        type: choice
        required: true
        default: 'none'
        options:
          # none     — unsigned compile-only (iOS xcodebuild / Android assembleDebug)
          # firebase — Firebase App Distribution (.dev bundle IDs)
          # store    — TestFlight + Play Internal. Requires `version`. Pair with
          #            dry_run=true to verify the pipeline without uploading.
          - none
          - firebase
          - store
      version:
        description: 'Marketing version MAJOR.MINOR.PATCH — required when distribution=store (e.g. 0.0.2)'
        type: string
        default: ''
      dry_run:
        description: 'Build + sign but skip the upload step (only meaningful when distribution=store)'
        type: boolean
        default: false
      ios_enable_buy:
        # Buy Bitcoin is on by default in every build; store builds
        # (ios-release) pass VITE_IOS_DISABLE_BUY=true for App Store
        # compliance (Guideline 3.1.5(iii)). This toggle skips that
        # kill flag for TestFlight open-beta builds. NEVER submit a
        # flagged build to App Store review — release-* tag builds
        # always disable Buy.
        description: 'Keep the Buy Bitcoin button in an iOS store build (TestFlight beta only — never for App Store review)'
        type: boolean
        default: false
      notes:
        # Multiline string for custom release notes on Firebase App
        # Distribution and store uploads. When empty, those jobs fall
        # back to scripts/ci/release-notes.sh (auto-generated from git
        # log since the prior release-* tag). A store build dispatched
        # without a release-* tag has no annotated tag to read, so this
        # is the only way to give testers hand-curated notes.
        description: 'Custom release notes for FAD or store uploads (multiline; falls back to auto-generated when blank)'
        type: string
        default: ''

# Cancel superseded runs on the same PR / branch. Matches the glow-web
# pattern and saves ~15–25% of minute burn on busy PRs (especially
# iOS, which is the expensive job). event_name is in the group so a
# main-push warm run can't cancel an in-flight workflow_dispatch build
# from main (both share ref refs/heads/main); same-event supersession
# (PR pushes, repeated dispatches) still cancels as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Jobs that need more (release-github writes
# a GitHub Release) scope up at the job level.
permissions:
  contents: read

jobs:
  # Signing material (keystores, certs, provisioning profiles, service
  # accounts) must live in GitHub secrets, never in the tree. .gitignore
  # blocks an accidental `git add`; this catches an already-tracked file
  # or a `git add -f` bypass, on every PR and push. Keep in sync with the
  # signing-material patterns in .gitignore.
  guard-signing-material:
    name: No signing material in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any keystore, cert, or profile is tracked
        run: |
          set -euo pipefail
          hits=$(git ls-files \
            '*.keystore' '*.jks' '*.p12' '*.p8' '*.mobileprovision' \
            'play-service-account.json' || true)
          if [ -n "$hits" ]; then
            echo "::error::Signing material must never be committed. Tracked file(s):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no signing material tracked"

  # Gate on workflow_dispatch input combinations. Catches invalid combos
  # (distribution=store with no version, malformed version, etc.) in
  # <30s on a Linux runner before any macOS runner spins up. Wired into
  # every dispatch-reachable job's `needs:` so an invalid dispatch can't
  # burn ~200 macOS min before the first build step notices the problem.
  #
  # Skipped on tag pushes + PR events — the `github.event_name` gate
  # keeps it off the hot path. Downstream jobs use
  # `needs.validate-inputs.result != 'failure'` so a skipped validate
  # (non-dispatch event) doesn't cascade into a skip.
  validate-inputs:
    name: Validate dispatch inputs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Enforce input combinations
        env:
          TARGET:       ${{ inputs.target }}
          DISTRIBUTION: ${{ inputs.distribution }}
          VERSION:      ${{ inputs.version }}
          DRY_RUN:      ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          warn() { echo "::warning::$1"; }

          if [[ "$DISTRIBUTION" == "store" ]]; then
            [[ -n "$VERSION" ]] || fail "distribution=store requires version input (MAJOR.MINOR.PATCH, e.g. 0.0.2)"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must match MAJOR.MINOR.PATCH, got: '$VERSION'"
          fi

          if [[ -n "$VERSION" && "$DISTRIBUTION" != "store" ]]; then
            warn "version='$VERSION' ignored — only distribution=store uses version"
          fi

          if [[ "$DRY_RUN" == "true" && "$DISTRIBUTION" != "store" ]]; then
            warn "dry_run=true ignored — only distribution=store has an upload step to skip"
          fi

          echo "validated target=$TARGET distribution=$DISTRIBUTION version=${VERSION:-<none>} dry_run=$DRY_RUN"

  # Linux-side probe of the macOS SDK artifact cache. Saves ~2–3 macOS min ×
  # 10× billing on warm-cache iOS runs by confirming cache existence before
  # any macos-15 VM spins up. GitHub's cache service is OS-agnostic at the
  # lookup layer — the key is just a string, `lookup-only: true` does no
  # download. Fail-open: any probe error yields `ios-cache-hit=''` which
  # warm-sdk-macos reads as "run anyway".
  preflight:
    name: Preflight (probe macOS SDK cache from Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Independent of validate-inputs — the probe is harmless on a
    # failed-validation dispatch (warm-sdk-macos is the fail-fast point).
    # On main pushes the probe also gates warm-sdk-macos: once main's
    # scope holds the current pin, repeat pushes skip the macOS runner.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      contains(github.event.pull_request.labels.*.name, 'run-ios') ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["ios","both"]'), inputs.target))
    outputs:
      ios-cache-hit: ${{ steps.set-output.outputs.ios-cache-hit }}
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned SDK SHA
        id: sdk-sha
        # Must match the composite action's grep logic verbatim —
        # any divergence shapes a miss-shaped hash and defeats this probe.
        run: |
          echo "sha=$(grep -vE '^\s*(#|$)' .spark-sdk-ref | head -n 1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "ndk=$(grep -vE '^\s*(#|$)' .android-ndk-version | head -n 1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Probe macOS SDK artifact cache
        id: probe
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          # Key must match warm-sdk-macos exactly (runner.os=macOS there,
          # hardcoded here since we're probing from Linux). The NDK segment
          # comes from .android-ndk-version, same as setup-glow-app —
          # probing the old ndk-less key once skipped the macOS warmer
          # while consumers missed on the real key (preview-20260705).
          key: sdk-artifacts-macOS-ndk${{ steps.sdk-sha.outputs.ndk }}-${{ steps.sdk-sha.outputs.sha }}
          # Paths are required syntactically but unused under lookup-only.
          path: |
            .spark-sdk-checkout/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz
            .spark-sdk-checkout/crates/breez-sdk/bindings/langs/swift
            ~/.m2/repository/breez_sdk_spark
          lookup-only: true

      - name: Set ios-cache-hit output
        id: set-output
        run: |
          hit="${{ steps.probe.outputs.cache-hit }}"
          echo "ios-cache-hit=${hit:-}" >> "$GITHUB_OUTPUT"
          if [[ "$hit" == "true" ]]; then
            echo "macOS SDK cache HIT for sha=${{ steps.sdk-sha.outputs.sha }} — skipping warm-sdk-macos"
          else
            echo "macOS SDK cache MISS or error (hit='${hit:-}') for sha=${{ steps.sdk-sha.outputs.sha }} — warm-sdk-macos will run"
          fi

  # SDK "warmer" jobs build spark-sdk from source once per pinned SHA per OS
  # and cache the output artifacts. Every downstream job `needs:`-waits for
  # the matching warmer and runs setup-glow-app in consumer mode (restore
  # only). Warm path: warmer ~1–2 min, consumers skip the SDK build.
  # Cold path: SDK build cost is paid ONCE instead of per-job.
  warm-sdk-linux:
    name: Warm SDK cache (Linux — wasm + android)
    runs-on: ubuntu-latest
    needs: [validate-inputs]
    timeout-minutes: 45
    # `!cancelled()` overrides GH's implicit success() prefix — without
    # it, a skipped validate-inputs (every non-dispatch event) cascades
    # into this job being skipped regardless of the explicit `if:`.
    # Regressed release-0.0.3's first CI run.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        (contains(fromJSON('["android","both"]'), inputs.target) ||
         inputs.distribution != 'none')))
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-glow-app
        with:
          # PR events warm wasm ONLY (~9 min): no PR job consumes the
          # Android artifacts (`android` is dispatch-only, previews and
          # releases are tag-gated), and a PR-scope cache dies with the
          # PR — the ~28-min 4-ABI Android build there was pure waste.
          # The canonical full set is built where it's consumed: main
          # pushes (cache warming), tags, and dispatches.
          platforms: ${{ github.event_name == 'pull_request' && 'wasm' || 'wasm,android' }}
          mode: warmer
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

  # Only fires when an iOS build will consume the xcframework AND the
  # preflight probe did NOT confirm a macOS SDK cache hit. The
  # `preflight.outputs.ios-cache-hit != 'true'` check is the cost
  # optimization — a Linux runner verified existence first, so we
  # skip the ~3 macOS min the composite action's consumer restore
  # would otherwise burn just to confirm what preflight already knew.
  #
  # Consumer iOS jobs (ios, ios-preview, ios-release) still restore
  # the cache inline via setup-glow-app — this skip only saves the
  # dedicated "verify only" macOS round-trip, not the actual restore
  # by the build job.
  warm-sdk-macos:
    name: Warm SDK cache (macOS — wasm + ios)
    runs-on: macos-15
    # warm-sdk-linux is in needs: so the Linux-built WASM tgz (saved
    # under an OS-neutral cache key) is available for cross-OS restore
    # before this job builds — the macOS warmer then skips Homebrew
    # LLVM + `make sdk-wasm` entirely (~8 macOS min ≈ 80 billed-min at
    # 10× billing). Cold-path wall time serializes behind the Linux
    # warmer, which only matters on the already-documented "tag pushed
    # seconds after merge" race; on main pushes nobody is waiting. When
    # warm-sdk-linux SKIPS (iOS-only dispatch) the tgz restore misses
    # and setup-glow-app falls back to building wasm locally — the
    # pre-optimization behavior, not a failure.
    needs: [validate-inputs, preflight, warm-sdk-linux]
    timeout-minutes: 60
    # `!cancelled()` bypasses the default-skip cascade from
    # validate-inputs (dispatch-only). See warm-sdk-linux for rationale.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-linux.result != 'failure' &&
      needs.preflight.outputs.ios-cache-hit != 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       contains(github.event.pull_request.labels.*.name, 'run-ios') ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target)))
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios
          mode: warmer

  # Static-analysis gate: tsc --noEmit + eslint + vitest on glow-web.
  # Runs on every PR + every tag + every distribution-bound dispatch.
  # Does NOT build Android/iOS — that's the dev's responsibility before
  # pushing. Build regressions are caught at release-tag time.
  web:
    name: Web (glow-web submodule)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux]
    # == 'success' on the warmer is the fail-fast route for invalid
    # dispatches: validate-inputs fails → warmer skips → this check is
    # false → consumer skips. No direct validate-inputs edge needed.
    if: >-
      !cancelled() &&
      needs.warm-sdk-linux.result == 'success' &&
      (github.event_name == 'pull_request' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.distribution != 'none'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm

      - name: Install glow-web deps + local Spark SDK tgz
        # Overlay the warmer-cached WASM tgz onto @breeztech/breez-sdk-spark
        # without mutating the lockfile. $SPARK_SDK_DIR is set by
        # setup-glow-app (workspace-relative to dodge actions/cache's
        # `..`-path rejection).
        run: |
          set -euo pipefail
          TGZ="$SPARK_SDK_DIR/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz"
          if [[ ! -f "$TGZ" ]]; then
            echo "error: expected WASM tgz at $TGZ — warmer cache restore failed?" >&2
            exit 1
          fi
          echo "Installing local SDK: $TGZ"
          cd glow-web
          npm ci
          npm install "$TGZ" --no-save

      - name: Typecheck
        run: cd glow-web && npx tsc --noEmit

      - name: Lint
        run: cd glow-web && npm run lint

      - name: Unit tests
        run: cd glow-web && npm run test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-results
          path: glow-web/coverage/**/*.json
          retention-days: 7
          if-no-files-found: ignore

  # Android unsigned compile-check. Dispatch-only; release-* tags fall
  # through to android-release (signed AAB). Symmetric with `ios`.
  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux]
    if: >-
      !cancelled() &&
      needs.warm-sdk-linux.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["android","both"]'), inputs.target) &&
      inputs.distribution == 'none'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - name: Setup JDK 21 (Capacitor 8 + AGP 8)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Falls back to an unencrypted shared cache when the secret is unset.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build time —
        # without it, SDK init fails on every launch.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web-dev

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Compute version
        # VERSION_NAME={basis}-dev.{short-sha}, VERSION_CODE=GITHUB_RUN_NUMBER.
        # Gradle reads both via System.getenv() so the APK is traceable.
        run: ./scripts/ci/compute-version.sh

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: glow-${{ github.sha }}-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS (xcodebuild, unsigned)
    runs-on: macos-15
    needs: [warm-sdk-macos, validate-inputs]
    timeout-minutes: 60
    # Unsigned compile-check. PRs opt in via `run-ios` label. Does NOT fire
    # on release-* tag push (ios-release already archives there).
    #
    # `!cancelled()` is load-bearing across all three iOS consumers: GH
    # Actions implicitly prepends success() to every `if:`, and with
    # warm-sdk-macos in needs:, a preflight cache hit (→ warm-sdk-macos
    # SKIPPED) flips the implicit success() to false — this job skips too,
    # even with our explicit `!= 'failure'` checks. `!cancelled()` overrides
    # that default. Regressed run 24618034776.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-macos.result != 'failure' &&
      (contains(github.event.pull_request.labels.*.name, 'run-ios') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target) &&
        inputs.distribution == 'none'))
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        # Pin Xcode so GitHub's default rotation can't invalidate caches.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web-dev

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Compute version
        run: ./scripts/ci/compute-version.sh

      - name: Apply version to iOS project
        run: ./scripts/ci/apply-ios-version.sh

      - name: xcodebuild (unsigned device build)
        # CODE_SIGN_* trio disables all signing negotiation for the
        # compile-check path. Matches DEVELOPMENT.md's local command.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -allowProvisioningUpdates=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Upload xcodebuild log on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-build-log
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore

  ios-preview:
    name: iOS preview (Firebase App Distribution)
    runs-on: macos-15
    needs: [warm-sdk-macos, validate-inputs]
    # Same cold-run budget as the `ios` job plus FAD upload time.
    timeout-minutes: 60
    # Fires on preview-*/rc-* tag pushes OR dispatch
    # (target=ios|both, distribution=firebase).
    # distribution=store routes to ios-release instead.
    # `!cancelled()` load-bearing — see `ios` job above.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-macos.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/preview-') ||
       startsWith(github.ref, 'refs/tags/rc-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target) &&
        inputs.distribution == 'firebase'))
    permissions:
      contents: read
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_PREVIEW_KEYCHAIN_PASSWORD }}
      P12_BASE64: ${{ secrets.IOS_PREVIEW_CERT_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_PREVIEW_CERT_P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PREVIEW_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # release-notes.sh walks release-* tags to find the prior release.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Import distribution cert + ad-hoc profile
        run: ./scripts/ci/import-ios-cert.sh

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web-dev

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Compute version
        # Preview/rc tags → `{basis}-preview.N` / `{basis}-rc.N`;
        # dispatch-firebase → `{basis}-dev.{short-sha}`.
        # GITHUB_RUN_NUMBER as VERSION_CODE gives each upload a distinct
        # (ShortVersion, BundleVersion) tuple so iOS FAD's strict dedup
        # doesn't collapse uploads into a single slot.
        run: ./scripts/ci/compute-version.sh

      - name: Apply version to iOS project
        run: ./scripts/ci/apply-ios-version.sh

      - name: Archive + export IPA (Debug, release-testing)
        # `release-testing` is Xcode 15.3+'s name for the old `ad-hoc`.
        run: ./scripts/ci/build-ios-ipa.sh Debug release-testing

      - name: Generate release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_NOTES:-}" ]]; then
            printf '%s\n' "$INPUT_NOTES" > "${GITHUB_WORKSPACE}/build/release-notes.txt"
            echo "=== release-notes.txt (workflow_dispatch input) ==="
          else
            ./scripts/ci/release-notes.sh > "${GITHUB_WORKSPACE}/build/release-notes.txt"
            echo "=== release-notes.txt (auto-generated) ==="
          fi
          cat "${GITHUB_WORKSPACE}/build/release-notes.txt"

      - name: Upload to Firebase App Distribution (fastlane)
        # :upload_firebase lane wraps firebase_app_distribution. IPA_PATH
        # is absolute because build-ios-ipa.sh writes to repo-root build/,
        # not ios/App/build/.
        working-directory: ios/App
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID_PREVIEW }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          IPA_PATH: ${{ github.workspace }}/build/App.ipa
          FAD_GROUPS: internal
          RELEASE_NOTES_FILE: ${{ github.workspace }}/build/release-notes.txt
        run: |
          set -euo pipefail
          export RELEASE_NOTES="$(cat "$RELEASE_NOTES_FILE")"
          bundle exec fastlane upload_firebase

      - name: Upload archive on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-preview-archive
          path: build/App.xcarchive
          retention-days: 7
          if-no-files-found: ignore

  android-preview:
    name: Android preview (Firebase App Distribution)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux]
    timeout-minutes: 30
    # Parity with ios-preview. `!cancelled()` load-bearing — see `ios` above.
    if: >-
      !cancelled() &&
      needs.warm-sdk-linux.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/preview-') ||
       startsWith(github.ref, 'refs/tags/rc-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["android","both"]'), inputs.target) &&
        inputs.distribution == 'firebase'))
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # release-notes.sh walks release-* tags to find the prior release.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web-dev

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Compute version
        run: ./scripts/ci/compute-version.sh

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Generate release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/build"
          if [[ -n "${INPUT_NOTES:-}" ]]; then
            printf '%s\n' "$INPUT_NOTES" > "${GITHUB_WORKSPACE}/build/release-notes.txt"
            echo "=== release-notes.txt (workflow_dispatch input) ==="
          else
            ./scripts/ci/release-notes.sh > "${GITHUB_WORKSPACE}/build/release-notes.txt"
            echo "=== release-notes.txt (auto-generated) ==="
          fi
          cat "${GITHUB_WORKSPACE}/build/release-notes.txt"

      - name: Upload to Firebase App Distribution (fastlane)
        working-directory: android
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID_PREVIEW }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ANDROID_ARTIFACT_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          ANDROID_ARTIFACT_TYPE: APK
          FAD_GROUPS: internal
          RELEASE_NOTES_FILE: ${{ github.workspace }}/build/release-notes.txt
        run: |
          set -euo pipefail
          export RELEASE_NOTES="$(cat "$RELEASE_NOTES_FILE")"
          bundle exec fastlane upload_firebase

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-preview-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7
          if-no-files-found: ignore

  android-release:
    name: Android release (Play testing tracks)
    runs-on: ubuntu-latest
    needs: [warm-sdk-linux]
    timeout-minutes: 45
    # Above the read-only default: attesting the distributable APK mints a
    # provenance statement signed by this run's OIDC identity.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # release-* tag push OR dispatch (target=android|both, distribution=store).
    # dry_run=true verifies the upload pipeline without publishing.
    # `!cancelled()` load-bearing — see `ios` job above.
    if: >-
      !cancelled() &&
      needs.warm-sdk-linux.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/release-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["android","both"]'), inputs.target) &&
        inputs.distribution == 'store'))
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so release-notes.sh can find the prior release-* tag.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Fastlane drives only the universal-APK download below; the build and
      # the Play upload stay on Gradle.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        # tr -d strips whitespace before decode — `gh secret set < file`
        # can introduce wrapping/LF that makes GNU base64 reject the input.
        run: |
          set -euo pipefail
          # An unset secret renders as an empty string, which decodes to an
          # empty file without error and leaves the signing config
          # incomplete. Fail here, at the step whose name matches the cause,
          # rather than several steps later.
          if [[ -z "${RELEASE_KEYSTORE_BASE64//[[:space:]]/}" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is empty or unset. Cannot sign a release build."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write Play service account
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "$PLAY_SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Compute version from tag
        # GLOW_RELEASE_TAG override path (see ios-release step comment
        # for rationale). On release-* tag push, GITHUB_REF_NAME is
        # already correct and GLOW_RELEASE_TAG stays empty.
        env:
          GLOW_RELEASE_TAG: >-
            ${{ (github.event_name == 'workflow_dispatch' &&
                 inputs.distribution == 'store')
                && format('release-{0}', inputs.version)
                || '' }}
        run: ./scripts/ci/compute-version.sh

      - name: Generate release notes
        # Play caps release notes at 500 chars per locale — GPP's
        # edits:commit fails with "length N, which is too long (max: 500)"
        # otherwise. Truncate to 497 + "…"; git log is newest-first so the
        # most recent commit subjects survive.
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_NOTES:-}" ]]; then
            FULL_NOTES="$INPUT_NOTES"
          else
            FULL_NOTES="$(./scripts/ci/release-notes.sh)"
          fi
          if [[ ${#FULL_NOTES} -gt 500 ]]; then
            SHORT_NOTES="${FULL_NOTES:0:497}…"
          else
            SHORT_NOTES="$FULL_NOTES"
          fi
          # One file per track we publish to: GPP reads the notes for
          # whichever track it is writing, so the promote steps below need
          # alpha.txt / beta.txt or they would ship empty notes.
          for track in internal alpha beta; do
            printf '%s\n' "$SHORT_NOTES" > "android/app/src/main/play/release-notes/en-US/$track.txt"
          done
          echo "=== Play release notes (truncated to ${#SHORT_NOTES} chars) ==="
          cat android/app/src/main/play/release-notes/en-US/internal.txt

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Gradle bundleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew :app:bundleRelease --no-daemon

      # Confirms the bundle carries the certificate we expect before
      # anything consumes it. Every later step implies success(), so a
      # mismatch stops the Play upload, both track promotions, the
      # universal-APK download and all artifact uploads.
      - name: Verify AAB signing certificate
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # Optional: set this repo variable to the upload certificate's
          # SHA-256 to compare against a fixed value, the same way
          # PLAY_EXPECTED_CERT_SHA256 pins the Play-signed APK further down.
          # Unset falls back to comparing against the keystore this job
          # decoded.
          EXPECTED_UPLOAD_CERT_SHA256: ${{ vars.EXPECTED_UPLOAD_CERT_SHA256 }}
        run: |
          ./scripts/ci/verify-aab-signature.sh \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Play internal
        # Split from the bundle build so dry_run can skip the upload while
        # still producing the signed AAB artifact below. `dry_run` is a
        # boolean input, so it must not be compared against the STRING
        # 'true': GitHub coerces the mismatched operands to numbers, the
        # string becomes NaN, and every comparison with NaN is false, which
        # made the old `!= 'true'` guard always pass. On tag pushes
        # `inputs.dry_run` is null, so the negation still runs the step.
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew :app:publishReleaseBundle --no-daemon

      - name: Promote to closed + open testing
        if: ${{ !inputs.dry_run }}
        # The AAB is already uploaded — promoting reuses that same artifact
        # instead of re-uploading it, so the version code stays identical
        # across all three tracks. Both promotes read from `internal`
        # (promoting does not remove the release from the source track).
        # `production` is deliberately absent: that step stays manual in
        # Play Console.
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          for track in alpha beta; do
            ./gradlew :app:promoteReleaseArtifact --no-daemon \
              --from-track internal --promote-track "$track"
          done

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          # VERSION_NAME (populated by compute-version.sh) is always slash-
          # free — unlike github.ref_name, which on dispatch-from-branch runs
          # is the branch name and can contain `/`.
          name: glow-${{ env.VERSION_NAME }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Sideload distribution (Obtainium, Zapstore) ships the universal APK
      # Play generates from the bundle we just uploaded, rather than a second
      # build signed by us. It therefore carries the same certificate as the
      # Play install, so the two can update each other on a device and the
      # passkey domain files already trust it. Requires the upload to have
      # happened, hence the dry_run guard.
      - name: Download Play-signed universal APK
        if: ${{ !inputs.dry_run }}
        working-directory: android
        env:
          PLAY_PACKAGE_NAME: technology.breez.glow
          PLAY_VERSION_CODE: ${{ env.VERSION_CODE }}
          PLAY_APK_DESTINATION: ${{ github.workspace }}/build/glow-${{ env.VERSION_NAME }}.apk
          # The Play App Signing certificate registered for this package in
          # the passkey domain files. Pinning it means a key rotation on
          # Google's side fails the release here, rather than shipping an APK
          # that installs fine and then cannot sign in.
          PLAY_EXPECTED_CERT_SHA256: '7A:F9:76:F7:E8:32:DD:5F:AD:CD:AD:9A:40:7D:08:A4:21:28:F2:75:ED:F4:E3:BA:3B:B3:CA:FE:73:CD:89:93'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          bundle exec fastlane download_play_apk

      # Play built and signed this APK, so the provenance statement attests
      # that this release run produced and published the file, not that it
      # compiled it. The Play signature is what proves authorship of the code.
      - name: Attest APK provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/glow-${{ env.VERSION_NAME }}.apk

      - name: Upload APK artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: glow-${{ env.VERSION_NAME }}-apk
          path: build/glow-${{ env.VERSION_NAME }}.apk
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-release-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7
          # Compute-version hard-fail path never produces reports — skip
          # the "No files were found" warning in that case.
          if-no-files-found: ignore

  ios-release:
    name: iOS release (TestFlight)
    runs-on: macos-15
    needs: [warm-sdk-macos, validate-inputs]
    timeout-minutes: 75
    # release-* tag push (paired with android-release + release-github) OR
    # dispatch (target=ios|both, distribution=store). target=ios dispatch
    # = iOS-only hotfix rebuild without firing android-release / release-github.
    # `!cancelled()` load-bearing — see `ios` job above.
    if: >-
      !cancelled() &&
      needs.validate-inputs.result != 'failure' &&
      needs.warm-sdk-macos.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/release-') ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["ios","both"]'), inputs.target) &&
        inputs.distribution == 'store'))
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # release-notes.sh needs full tag history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
          # App Store submissions must never show Buy Bitcoin
          # (Guideline 3.1.5(iii)) — always disabled on release-* tags.
          # The ios_enable_buy dispatch input keeps it for
          # TestFlight-only beta builds.
          VITE_IOS_DISABLE_BUY: ${{ inputs.ios_enable_buy && 'false' || 'true' }}
        run: make web

      - name: Install glow-app deps
        run: npm ci

      - name: Capacitor sync (iOS)
        # Before apply-ios-version — cap sync rewrites project refs but
        # preserves version settings.
        run: npx cap sync ios

      - name: Compute version from tag
        # GH Actions silently ignores overrides of GITHUB_REF_NAME via
        # $GITHUB_ENV — the ios-hotfix dispatch shipped 0.0.0 because of
        # this. GLOW_RELEASE_TAG is compute-version.sh's explicit override.
        env:
          GLOW_RELEASE_TAG: >-
            ${{ (github.event_name == 'workflow_dispatch' &&
                 inputs.distribution == 'store')
                && format('release-{0}', inputs.version)
                || '' }}
        run: ./scripts/ci/compute-version.sh

      - name: Apply version to iOS project
        run: ./scripts/ci/apply-ios-version.sh

      - name: Generate release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_NOTES:-}" ]]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES=$(./scripts/ci/release-notes.sh)
          fi
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Import distribution cert + app-store profile
        # Maps the IOS_RELEASE_* secrets onto the generic env vars
        # import-ios-cert.sh reads. Same cert as ios-preview; only
        # the profile differs (app-store vs ad-hoc). EXPECTED_* vars
        # fail fast if IOS_RELEASE_PROFILE_BASE64 holds the wrong
        # type (symmetric guard with ios-preview).
        env:
          P12_BASE64: ${{ secrets.IOS_RELEASE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_RELEASE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_RELEASE_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_RELEASE_PROFILE_BASE64 }}
        run: ./scripts/ci/import-ios-cert.sh

      - name: Archive + export IPA (Release, app-store-connect)
        run: ./scripts/ci/build-ios-ipa.sh Release app-store-connect

      - name: Upload to TestFlight via fastlane
        # Same boolean guard as the Play upload: without it dry_run built,
        # signed, and then shipped the build to TestFlight anyway.
        if: ${{ !inputs.dry_run }}
        working-directory: ios/App
        env:
          # Dual auth — Fastfile picks API key if all three set, else
          # falls back to FASTLANE_USER/PASSWORD. `env_present?` treats
          # empty-string secrets as absent.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          # 2FA session cookie; legacy path only, expires every few weeks.
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          # Absolute — build-ios-ipa.sh writes to repo-root build/, not
          # ios/App/build/.
          IPA_PATH: ${{ github.workspace }}/build/App.ipa
        run: bundle exec fastlane upload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          # See android-release AAB comment above — VERSION_NAME is
          # slash-safe on dispatch-from-branch runs.
          name: glow-${{ env.VERSION_NAME }}-ipa
          path: build/App.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-release-archive
          path: build/App.xcarchive
          retention-days: 7
          # See android-release equivalent — silences the "No files
          # were found" warning when the failure is pre-archive.
          if-no-files-found: ignore

  # Publishes a GitHub Release with AAB + IPA artifacts. ONLY fires on
  # release-* tag push — target=both distribution=store dispatches build
  # the same artifacts but don't publish (no tag to attach to).
  release-github:
    name: Draft GitHub Release
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    # `!cancelled()` + explicit == 'success' on both upstreams — the
    # default skip-cascade through transitive validate-inputs would
    # otherwise skip this job even when both upstreams finished clean
    # (regressed release-0.0.3's first attempt).
    if: >-
      !cancelled() &&
      needs.android-release.result == 'success' &&
      needs.ios-release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/release-')
    permissions:
      # softprops/action-gh-release needs write to mutate releases.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Matches glow-<version>-aab + glow-<version>-ipa from the two
          # upstream jobs (names use env.VERSION_NAME = X.Y.Z, not the tag).
          pattern: glow-*
          merge-multiple: true

      - name: Compose release notes
        run: ./scripts/ci/release-notes.sh > RELEASE_NOTES.md

      # Drafted, not published. A release tag's job is to put builds in
      # front of testers on TestFlight and the Play testing tracks; both
      # store rollouts stay manual, so nothing here is approved for
      # production the moment the tag lands. Publishing is also what
      # reaches sideload users — Obtainium and Zapstore poll releases for
      # the Play-signed universal APK attached below, and a draft is
      # invisible to them. Publish by hand once production is rolled out;
      # that is where the "latest release" choice gets made, because
      # make_latest below does not apply while the release is a draft.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.aab
            artifacts/**/*.apk
            artifacts/**/*.ipa
          draft: true
          prerelease: false
          make_latest: true
