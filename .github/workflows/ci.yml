name: CI

# Keep docs-only PRs off the full build matrix. paths-ignore applies
# to the whole workflow; if any path NOT in this list changed, all
# jobs run.
#
# ios-preview additionally fires on preview-* / rc-* tags and on
# manual workflow_dispatch; see the job-level `if:` in Step 6.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    tags: ['preview-*', 'rc-*', 'release-*']
  workflow_dispatch:

# Cancel superseded runs on the same PR / branch. Matches the glow-web
# pattern and saves ~15–25% of minute burn on busy PRs (especially
# iOS, which is the expensive job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The ios-preview job (Step 6) scopes up to
# what Firebase App Distribution needs.
permissions:
  contents: read

jobs:
  # Detect which parts of the repo changed in this PR so we can skip
  # the irrelevant Ubuntu builds. Cuts roughly half of Dependabot CI
  # time (a gradle-only bump doesn't need the web job; an npm-only
  # bump doesn't need the android job) and the same on real PRs
  # that touch only one side.
  #
  # On `push` events (main + tags) every downstream job runs
  # unconditionally — path filtering is PR-only, treat main as the
  # full-coverage channel.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    # dorny/paths-filter calls the GitHub API's pulls.listFiles to
    # compute the changed-path set for a pull_request event. The
    # top-level `permissions: contents: read` doesn't cover that;
    # add the scoped read here. Scoped to this job only so the
    # downstream jobs can't abuse the elevated token.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'glow-web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'plugins/**'
              - 'capacitor.config.ts'
              - '.github/workflows/**'
              - '.github/actions/**'
            android:
              - 'android/**'
              - 'package.json'
              - 'package-lock.json'
              - 'plugins/**'
              - 'capacitor.config.ts'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'Makefile'

  web:
    name: Web (glow-web submodule)
    runs-on: ubuntu-latest
    needs: changes
    # Run on: any non-PR event (main pushes, tag pushes, manual
    # dispatch), OR on a PR where glow-web / npm root / plugin /
    # shared CI paths changed. Skipped = passing per branch
    # protection config (documented in DEVELOPMENT.md#branch-protection).
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.web == 'true')
    # 20 min is cold-run headroom: the first run has to build the
    # WASM SDK from source (~10 min) + install glow-web deps + run
    # tsc/eslint/vitest. Warm runs with SDK cache hit are ~3 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm

      - name: Install glow-web deps + local Spark SDK tgz
        # The composite action restored the WASM tgz into
        # ../spark-sdk/packages/wasm/. Resolve to an absolute path
        # before `cd glow-web` — a relative `../spark-sdk/...` would
        # resolve against the new PWD and land one directory off.
        # `npm install <tgz>` overlays it on @breeztech/breez-sdk-spark
        # without mutating the lockfile.
        run: |
          set -euo pipefail
          TGZ="$(realpath ../spark-sdk/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz)"
          echo "Installing local SDK: $TGZ"
          cd glow-web
          npm ci
          npm install "$TGZ" --no-save

      - name: Typecheck
        run: cd glow-web && npx tsc --noEmit

      - name: Lint
        run: cd glow-web && npm run lint

      - name: Unit tests
        run: cd glow-web && npm run test

      # Upload vitest coverage artifacts on failure for PR-page
      # drilldown without needing a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: glow-web/coverage/**/*.json
          retention-days: 7

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.android == 'true')
    # 45 min is cold-run headroom: first run builds the WASM SDK
    # (~10 min) + Android NDK install (~3 min) + Android AAR
    # cross-compile (~5 min) + glow-web vite build (~3 min) +
    # gradle assembleDebug (~5 min). Warm runs with SDK cache hit
    # are ~8 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - name: Setup JDK 21 (Capacitor 8 + AGP 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Encrypts the Gradle configuration-cache across runs.
          # Safe without the secret — the action falls back to a
          # non-encrypted shared cache when omitted.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.sha }}-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Failure-only upload of gradle / lint reports so the PR page
      # has enough to diagnose without a CI re-run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

  ios:
    name: iOS (xcodebuild, unsigned)
    runs-on: macos-15
    # 60 min cold-run headroom: iOS cross-compile is slower than
    # Android (~15 min), plus xcodebuild itself (~10 min on a cold
    # Pods cache). Warm runs with SDK + Pods cache hit are ~5 min.
    timeout-minutes: 60
    # Always run on main pushes and on preview / rc tags (so main
    # status never drifts). On PRs, opt in via the 'run-ios' label
    # to contain macOS-minute burn. Branch protection should be
    # configured with "skipped = passing" so PRs without the label
    # can still merge — see DEVELOPMENT.md#branch-protection.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-ios')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        # Pin Xcode to match local builds. macos-15 ships multiple
        # Xcode versions; the pin avoids invalidation when GitHub
        # rotates the default.
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: CocoaPods cache
        uses: actions/cache@v5
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: xcodebuild (unsigned device build)
        # Matches the local command in DEVELOPMENT.md. The three
        # CODE_SIGN_* flags together make xcodebuild stop
        # negotiating signing — Phase 4C wires signing back up for
        # TestFlight.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -allowProvisioningUpdates=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Upload xcodebuild log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: xcodebuild.log
          retention-days: 7

  ios-preview:
    name: iOS preview (Firebase App Distribution)
    runs-on: macos-15
    # Same cold-run budget as the `ios` job plus FAD upload time.
    timeout-minutes: 60
    # Tag-triggered (preview-* / rc-*) or manually dispatched.
    # Does NOT run on every main push — the CI plan-tier analysis
    # in plan-4b Step 10 assumes a maintainer-chosen cadence to
    # stay inside Free/Pro/Team macOS-minute quotas.
    if: >-
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/preview-') ||
        startsWith(github.ref, 'refs/tags/rc-')
      )) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_PREVIEW_KEYCHAIN_PASSWORD }}
      P12_BASE64: ${{ secrets.IOS_PREVIEW_CERT_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_PREVIEW_CERT_P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PREVIEW_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: CocoaPods cache
        uses: actions/cache@v5
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Import distribution cert + ad-hoc profile
        run: ./scripts/ci/import-ios-cert.sh

      - name: Build glow-web dist/
        # VITE_BREEZ_API_KEY is baked into the dist bundle at build
        # time — without it, SDK init fails on every launch and
        # mnemonic-based onboarding can't even reach the wallet.
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Archive + export IPA (Debug, ad-hoc)
        run: ./scripts/ci/build-ios-ipa.sh Debug ad-hoc

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID_PREVIEW }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal
          releaseNotes: |
            Trigger: ${{ github.ref_name }} (${{ github.event_name }})
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message || 'manual dispatch' }}
          file: build/App.ipa

      - name: Upload archive on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-preview-archive
          path: build/App.xcarchive
          retention-days: 7

  # ---------------------------------------------------------------
  # Phase 4C jobs below. preview-* / rc-* tags add Android FAD;
  # release-* tags fan out to android-release + ios-release, then
  # release-github finalizes with a GitHub Release.
  # ---------------------------------------------------------------

  android-preview:
    name: Android preview (Firebase App Distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Parity with ios-preview: tag-triggered or manual dispatch only,
    # never on main pushes (per the 4B macOS-budget logic — for
    # Android the budget pressure is lower but keeping the trigger
    # shape symmetric makes the mental model easier).
    if: >-
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/preview-') ||
        startsWith(github.ref, 'refs/tags/rc-')
      )) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps (applies patch-package patches)
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID_PREVIEW }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: internal
          releaseNotes: |
            Trigger: ${{ github.ref_name }} (${{ github.event_name }})
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message || 'manual dispatch' }}
          file: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-preview-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

  android-release:
    name: Android release (Play Internal)
    runs-on: ubuntu-latest
    # Cold-run budget: web + WASM build + Android NDK + AAR
    # cross-compile + bundleRelease + Play upload. With cache hits
    # the Play upload itself is the slowest step (~2-3 min).
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/release-')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Need full history so release-notes.sh can find the prior
          # release-* tag. Default fetch-depth: 1 would only see HEAD.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Write Play service account
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          echo "$PLAY_SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Compute version from tag
        run: ./scripts/ci/compute-version.sh

      - name: Generate release notes
        # GPP reads from the release-notes file path; we overwrite
        # the en-US/internal.txt placeholder with the git-log
        # output before publishReleaseBundle runs.
        run: |
          set -euo pipefail
          ./scripts/ci/release-notes.sh > android/app/src/main/play/release-notes/en-US/internal.txt
          cat android/app/src/main/play/release-notes/en-US/internal.txt

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps
        run: npm ci

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Gradle bundleRelease + publish
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew :app:bundleRelease :app:publishReleaseBundle --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.ref_name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-release-build-logs
          path: |
            android/app/build/reports/**/*
            android/build/reports/**/*
          retention-days: 7

  ios-release:
    name: iOS release (TestFlight)
    runs-on: macos-15
    # Cold-run budget: web + WASM + iOS xframework cross-compile +
    # Pods install + xcodebuild archive + IPA export + TestFlight
    # upload. ASC-side processing time is excluded
    # (skip_waiting_for_build_processing in Fastfile).
    timeout-minutes: 75
    if: startsWith(github.ref, 'refs/tags/release-')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # release-notes.sh needs full tag history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-glow-app
        with:
          platforms: wasm,ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Build glow-web dist/
        env:
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}
        run: make web

      - name: Install glow-app deps
        run: npm ci

      - name: Capacitor sync (iOS)
        # Run BEFORE apply-ios-version + signing. cap sync rewrites
        # Pods refs but preserves CURRENT_PROJECT_VERSION /
        # MARKETING_VERSION; running it first ensures version +
        # signing both land on the post-sync project state.
        run: npx cap sync ios

      - name: Compute version from tag
        run: ./scripts/ci/compute-version.sh

      - name: Apply version to iOS project
        run: ./scripts/ci/apply-ios-version.sh

      - name: Generate release notes
        run: |
          set -euo pipefail
          NOTES=$(./scripts/ci/release-notes.sh)
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Import distribution cert + app-store profile
        # Maps the IOS_RELEASE_* secrets onto the generic env vars
        # import-ios-cert.sh reads. Same cert as ios-preview; only
        # the profile differs (app-store vs ad-hoc).
        env:
          P12_BASE64: ${{ secrets.IOS_RELEASE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_RELEASE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_RELEASE_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_RELEASE_PROFILE_BASE64 }}
        run: ./scripts/ci/import-ios-cert.sh

      - name: Archive + export IPA (Release, app-store)
        run: ./scripts/ci/build-ios-ipa.sh Release app-store

      - name: Upload to TestFlight via fastlane
        working-directory: ios/App
        env:
          # Dual auth — Fastfile picks API key if all three are set,
          # falls back to FASTLANE_USER/PASSWORD otherwise. Missing
          # secrets render as empty strings; the Fastfile's
          # `env_present?` helper treats "" as absent.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          # Optional — 2FA session cookie. Only needed on legacy path
          # for `upload_to_testflight` changelog updates against a
          # 2FA-protected Apple ID. Generate locally via
          # `fastlane spaceauth -u <email>`; expires every few weeks.
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          # build-ios-ipa.sh writes to $GITHUB_WORKSPACE/build/App.ipa
          # (repo-root build/). fastlane's working-directory is
          # ios/App/, so we pass the absolute path via the IPA_PATH
          # override the Fastfile reads.
          IPA_PATH: ${{ github.workspace }}/build/App.ipa
        run: bundle exec fastlane upload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: glow-${{ github.ref_name }}-ipa
          path: build/App.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-release-archive
          path: build/App.xcarchive
          retention-days: 7

  release-github:
    name: Publish GitHub Release
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-')
    permissions:
      # softprops/action-gh-release needs write to mutate releases.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Names: glow-<tag>-aab + glow-<tag>-ipa from the two upstream jobs.
          pattern: glow-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Compose release notes
        run: ./scripts/ci/release-notes.sh > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.aab
            artifacts/**/*.ipa
          prerelease: false
          make_latest: true
