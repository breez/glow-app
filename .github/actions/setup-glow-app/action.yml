name: Setup glow-app
description: >-
  Shared pre-build setup: Node 22 + resolve and cache the Spark
  SDK at the pinned commit from .spark-sdk-ref. Each job selects
  only the SDK platforms it needs via the `platforms` input.
  The calling job must run actions/checkout before using this
  composite — GitHub can't load a local composite action's files
  until the repo is checked out, so the checkout can't live here.

inputs:
  platforms:
    description: >-
      Comma-separated list of SDK platform targets the caller needs.
      Valid values: wasm, android, ios. Example: "wasm,android".
    required: true
  mode:
    description: >-
      "warmer"   = populate the SDK artifact cache on miss. Installs
                   the full Rust + wasm-pack + Android NDK + iOS
                   Rust target toolchain, builds via `make sdk-*`,
                   then the cache saves on job success. Use ONLY in
                   dedicated warm-sdk-* jobs whose sole purpose is
                   to populate caches.

      "consumer" = cache-restore only. Does NOT install the build
                   toolchain and does NOT invoke `make sdk-*` on
                   miss — a miss is reported as a warning but the
                   job continues (the downstream step consuming the
                   cached artifacts will fail fast if actually
                   missing, which is the correct loud-fail mode).
                   Use in every job EXCEPT the warmers.

      Default: "consumer". Backward-compat: existing callers that
      didn't specify a mode get consumer semantics, which requires
      a prior warm-sdk-* job in the workflow to populate the cache.
    required: false
    default: consumer

runs:
  using: composite
  steps:
    - name: Setup Node 22 (Capacitor 8 requirement)
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          package-lock.json
          glow-web/package-lock.json

    - name: Read pinned spark-sdk SHA + set SPARK_SDK_DIR
      id: sdk-sha
      shell: bash
      # SPARK_SDK_DIR is placed INSIDE $GITHUB_WORKSPACE (not ../spark-sdk)
      # so actions/cache accepts the paths. actions/cache@v5 rejects
      # any path containing `..`:
      #   "[warning]Invalid pattern '../spark-sdk/packages/wasm/...'.
      #    Relative pathing '.' and '..' is not allowed."
      # with those paths skipped silently from the save list. Keeping
      # the checkout workspace-relative sidesteps that restriction.
      # Makefile's `SPARK_SDK_DIR ?= $(abspath ../spark-sdk)` yields
      # to the env var when exported.
      run: |
        echo "sha=$(grep -vE '^\s*(#|$)' .spark-sdk-ref | head -n 1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
        echo "SPARK_SDK_DIR=$GITHUB_WORKSPACE/.spark-sdk-checkout" >> "$GITHUB_ENV"

    # Unified cache key per (OS, SHA) — warmer and consumer share it
    # verbatim. Previous platforms-slug scheme caused cache-miss for
    # consumers requesting `wasm` when the warmer saved `wasm+android`;
    # GitHub's restore-keys are prefix-matched, not suffix-matched,
    # so full alternate keys never matched.
    #
    # Warmer mode: actions/cache (read+write). Builds whatever the
    # caller's `platforms` input lists on miss, saves cache on success.
    # Consumer mode: actions/cache/restore (read-only). Restores
    # whatever the warmer saved. Platforms input is ignored for
    # cache-lookup purposes but still controls what gets warned-about
    # if a specific platform's file isn't in the restored set.
    - name: Cache Spark SDK output artifacts (warmer mode)
      if: inputs.mode == 'warmer'
      id: sdk-artifacts-cache-warmer
      uses: actions/cache@v5
      with:
        key: sdk-artifacts-${{ runner.os }}-${{ steps.sdk-sha.outputs.sha }}
        path: |
          .spark-sdk-checkout/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz
          .spark-sdk-checkout/crates/breez-sdk/bindings/langs/swift
          ~/.m2/repository/breez_sdk_spark

    - name: Restore Spark SDK output artifacts (consumer mode)
      if: inputs.mode == 'consumer'
      id: sdk-artifacts-cache-consumer
      uses: actions/cache/restore@v5
      with:
        key: sdk-artifacts-${{ runner.os }}-${{ steps.sdk-sha.outputs.sha }}
        path: |
          .spark-sdk-checkout/packages/wasm/breeztech-breez-sdk-spark-v0.1.0.tgz
          .spark-sdk-checkout/crates/breez-sdk/bindings/langs/swift
          ~/.m2/repository/breez_sdk_spark

    - name: Compute effective cache hit
      id: cache-hit
      shell: bash
      run: |
        # Unified key — exact match only, no restore-keys in play.
        # Both warmer and consumer report cache-hit true/false on
        # the same single key.
        if [[ "${{ inputs.mode }}" == "warmer" ]]; then
          echo "hit=${{ steps.sdk-artifacts-cache-warmer.outputs.cache-hit }}" >> "$GITHUB_OUTPUT"
        else
          echo "hit=${{ steps.sdk-artifacts-cache-consumer.outputs.cache-hit }}" >> "$GITHUB_OUTPUT"
        fi

    # Consumer-mode sanity: if cache missed entirely, fail loudly.
    # Previous implementation only warned, but that deferred the
    # error to confusing downstream "realpath: file not found"
    # messages. Better to halt in consumer mode so the operator
    # sees exactly what's missing.
    - name: Consumer-mode cache-miss error
      if: inputs.mode == 'consumer' && steps.cache-hit.outputs.hit != 'true'
      shell: bash
      run: |
        echo "::error::SDK artifact cache MISS in consumer mode. The warm-sdk-${{ runner.os }} job should have populated the cache BEFORE this job started. Check whether the warmer succeeded for SHA ${{ steps.sdk-sha.outputs.sha }}."
        echo "Expected key: sdk-artifacts-${{ runner.os }}-${{ steps.sdk-sha.outputs.sha }}"
        exit 1

    # Resolve (clone or verify) the spark-sdk checkout. Cheap on cache
    # hit (just verifies HEAD), a fresh clone on miss. Warmer only —
    # consumer mode never builds from source.
    - name: Resolve spark-sdk checkout
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true'
      shell: bash
      run: ./scripts/resolve-spark-sdk.sh

    # Second-line cache: Rust target/ directory for incremental
    # rebuilds when the artifact cache missed but Cargo.lock is
    # unchanged (e.g., cache eviction without a SDK bump).
    - name: Rust compile cache (fallback on artifact-cache miss)
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ../spark-sdk
        key: ${{ inputs.platforms }}-${{ steps.sdk-sha.outputs.sha }}

    # Toolchain pieces needed to build the SDK from source on a
    # cold cache. The `make sdk-*` targets invoke cargo + wasm-pack
    # + Gradle; the ubuntu runner is missing protoc / wasm-pack /
    # wasm32 / cargo-ndk by default. Each install is gated on the
    # platform(s) the job requested so web builds don't pay for
    # Android toolchain setup.

    # Use arduino/setup-protoc@v3 rather than apt-get / brew — the
    # Ubuntu protobuf-compiler package does NOT include the
    # well-known types (timestamp.proto, empty.proto, etc.) that
    # the spark-sdk .proto files import. setup-protoc ships a
    # statically-linked protoc with the WKTs baked in, works on
    # both Linux and macOS.
    - name: Install protoc (with well-known types)
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true'
      uses: arduino/setup-protoc@v3
      with:
        version: '25.x'
        # Pass the workflow's default token so setup-protoc's
        # GitHub release-info API calls are authenticated. Without
        # this it hits the 60 req/hr unauthenticated rate limit
        # (shared across all unauthenticated callers from the same
        # runner IP), which on busy shared IPs lands instantly.
        repo-token: ${{ github.token }}

    - name: Install wasm-pack + wasm32 target (if WASM requested)
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true' && contains(inputs.platforms, 'wasm')
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        if ! command -v wasm-pack >/dev/null 2>&1; then
          curl --retry 3 -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
        fi
        wasm-pack --version

    # macOS-only: spark-sdk's xtask auto-detects Homebrew LLVM for
    # wasm32 cross-compile (Apple's system clang lacks the wasm32
    # target). When the cache misses on a macos-15 runner, we need
    # to install it before `make sdk-wasm` runs. Linux is unaffected
    # (system clang via apt supports wasm32 natively).
    # Source: spark-sdk/crates/xtask/src/main.rs::detect_brew_llvm_paths.
    - name: Install Homebrew LLVM (macOS WASM cross-compile)
      if: >-
        runner.os == 'macOS' &&
        inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true' &&
        contains(inputs.platforms, 'wasm')
      shell: bash
      run: |
        brew install llvm
        # Sanity: spark-sdk's xtask shells out to `brew --prefix llvm`
        # to find the cc path. Verify it resolves to a real binary.
        CLANG_PATH="$(brew --prefix llvm)/bin/clang"
        if [[ ! -x "$CLANG_PATH" ]]; then
          echo "error: expected clang at $CLANG_PATH after brew install llvm" >&2
          exit 1
        fi
        echo "Homebrew LLVM clang at: $CLANG_PATH"
        "$CLANG_PATH" --version | head -1

    - name: Setup Android SDK + NDK (if android requested)
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true' && contains(inputs.platforms, 'android')
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        # Pre-accept licenses + install NDK 26 (matches what the
        # spark-sdk Android Gradle build expects) in one shot,
        # avoiding the `yes | sdkmanager` broken-pipe fragility.
        packages: "ndk;26.1.10909125 build-tools;34.0.0 platform-tools"

    - name: Expose ANDROID_NDK_HOME + install cargo-ndk + Android Rust targets
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true' && contains(inputs.platforms, 'android')
      shell: bash
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
        rustup target add aarch64-linux-android armv7-linux-androideabi \
          i686-linux-android x86_64-linux-android
        cargo install cargo-ndk --locked --version '^3'

    - name: Install iOS Rust targets (if ios requested)
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true' && contains(inputs.platforms, 'ios')
      shell: bash
      run: |
        rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

    - name: Build Spark SDK (cache miss only)
      if: inputs.mode == 'warmer' && steps.cache-hit.outputs.hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        IFS=',' read -ra PLATFORMS <<< "${{ inputs.platforms }}"
        for p in "${PLATFORMS[@]}"; do
          p="$(echo "$p" | xargs)"
          case "$p" in
            wasm)    make sdk-wasm ;;
            ios)     make sdk-ios ;;
            android) make sdk-android ;;
            "")      ;;
            *)
              echo "error: unknown platform '$p' (expected wasm, ios, or android)" >&2
              exit 1
              ;;
          esac
        done

    - name: Report cache state
      shell: bash
      run: |
        echo "Mode:                  ${{ inputs.mode }}"
        echo "SDK artifact cache hit: ${{ steps.cache-hit.outputs.hit }}"
        echo "Pinned SHA:            ${{ steps.sdk-sha.outputs.sha }}"
        echo "Requested platforms:   ${{ inputs.platforms }}"
