version: 2

# Dependabot opens weekly update PRs for every ecosystem glow-app
# depends on. Each PR runs through the full CI gate (web / android
# + opt-in ios) so regressions surface before a maintainer reviews.
#
# Ignores target the two patched Capacitor packages — bumping them
# without re-validating the patches in patches/ would silently break
# keyboard handling.
updates:
  # glow-app root — Capacitor CLI/core + plugins + patch-package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    ignore:
      - dependency-name: "@capacitor/keyboard"
      - dependency-name: "@capacitor/android"

  # glow-web submodule — React, Vite, Spark SDK peer.
  - package-ecosystem: npm
    directory: /glow-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, npm, submodule]

  # In-house Capacitor plugins that ship as file: deps.
  - package-ecosystem: npm
    directory: /plugins/capacitor-passkey-prf
    schedule:
      interval: weekly
    labels: [dependencies, npm, plugins]

  - package-ecosystem: npm
    directory: /plugins/capacitor-native-vault
    schedule:
      interval: weekly
    labels: [dependencies, npm, plugins]

  # Android Gradle (AGP / Kotlin / androidx).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    labels: [dependencies, gradle]

  # Pinned action versions in .github/workflows/ + composite actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
